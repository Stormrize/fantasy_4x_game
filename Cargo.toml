[package]
name = "fantasy-4x-game"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "0.20.1", features = ["trace", "debug", "bevy_gltf"] }
rand = "0.10.1"
noise = "0.9.0"
voronoice = "0.2.0"
faster_poisson = "1.3.0"
rand_chacha = "0.10.0"
serde = { version = "1.0.229", features = ["derive"] }
bevy_common_assets = { version = "0.18.0", features = ["ron"] }
smol_str = { version = "0.2.2", features = ["serde"] }
bevy-persistent = { version = "0.12.0", features = ["ron", "pretty"] }
sysdirs = "0.9.4"
ron = "0.12.3"
reqwest = { version = "0.13.5", features = ["query", "json", "blocking"] }
serde_json = "1.0.150"

[profile.dev]
debug = 1
opt-level = 0

[profile.dev.package."*"]
opt-level = 3
